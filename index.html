<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#111116">
  <title>D&D Friends Character Creator</title>
  <meta name="description" content="Launch the D&D Friends Character Creator.">
  <style>
    :root {
      color-scheme: dark;
      --bg:#0e0e12; --panel:#17171e; --line:#34343f;
      --text:#f5f2eb; --muted:#aaa6a0; --gold:#d7ad59; --gold2:#f0cf85;
    }
    * { box-sizing:border-box; }
    html,body { height:100%; }
    body {
      margin:0; font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      background:
        radial-gradient(circle at 50% -10%, rgba(215,173,89,.15), transparent 36rem),
        linear-gradient(180deg,#111117,#0b0b0f);
      color:var(--text); display:grid; place-items:center; padding:24px;
    }
    main {
      width:min(680px,100%); padding:clamp(30px,6vw,58px);
      background:rgba(23,23,30,.92); border:1px solid var(--line);
      border-radius:24px; box-shadow:0 24px 80px rgba(0,0,0,.42); text-align:center;
    }
    .mark {
      width:62px;height:62px;margin:0 auto 22px;border:1px solid rgba(215,173,89,.6);
      border-radius:18px;display:grid;place-items:center;color:var(--gold2);
      font-family:Georgia,serif;font-size:27px;font-weight:700;background:#111117;
    }
    .eyebrow { color:var(--gold); text-transform:uppercase; letter-spacing:.16em; font-size:.75rem; font-weight:800; }
    h1 { margin:10px 0 12px; font:700 clamp(2rem,6vw,3.35rem)/1.02 Georgia,serif; }
    p { margin:0 auto 28px; color:var(--muted); max-width:520px; line-height:1.65; }
    a.button {
      display:inline-flex; align-items:center; justify-content:center; gap:9px;
      min-height:52px; padding:0 24px; border-radius:12px; text-decoration:none;
      background:linear-gradient(180deg,var(--gold2),var(--gold)); color:#17120a;
      font-weight:850; box-shadow:0 8px 28px rgba(215,173,89,.17);
    }
    a.button:hover { filter:brightness(1.06); transform:translateY(-1px); }
    .note { margin-top:22px; font-size:.82rem; color:#77737a; }
  </style>
</head>
<body>
  <main>
    <div class="mark">D&F</div>
    <div class="eyebrow">D&D Friends</div>
    <h1>Character Creator</h1>
    <p>Build your character, check creation legality, select your items, and generate the finished inline bot command.</p>

    <!-- Replace the URL below with your deployed Google Apps Script /exec URL. -->
    <a class="button"
       href="https://script.google.com/macros/s/AKfycbwOaJkgiXR4xbK8yAhq3moek5OdteWmHbq_EtjiN-O19BtekpYorWbOg4_mfXsZpU8/exec"
       rel="noopener">
      Launch Character Creator →
    </a>

    <div class="note">The character creator opens in this tab.</div>
  </main>
</body>
</html>
